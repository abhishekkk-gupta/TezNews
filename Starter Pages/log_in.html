<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezNews Log In</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="sign_up_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <img src="logo.png" alt="TezTecch News Logo" id="logo">
        <h3>Log In</h3>
        <form id="login-form" action="https://teztecch.com">
            <input type="text" id="email" name="email" placeholder="Email or Phone Number" required><br><br>
            <input type="password" name="pswd" id="pswd" placeholder="Password" required><br>            
            <button id="login-btn">Log In</button><br>
            <a href="fpswd.html">Forgot Password?</a>
            <p>Don't have an account? <a href="sign_up.html">Sign Up</a></p>
        </form>
    </div>
</body>
</html>
