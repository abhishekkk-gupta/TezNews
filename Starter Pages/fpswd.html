<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezNews Verify E-mail</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="sign_up_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="fpswd-card">
        <img src="logo.png" alt="TezTecch News Logo" id="logo">
        <h3>Reset Password</h3>
        <form id="fpswd-form" action="fpswd2.html">
            <input type="text" id="email" name="email" placeholder="Email or Phone Number" required><br><br>
            <input type="text" name="otp" id="otp" placeholder="Enter OTP" required><br>
            <button id="fpswd-btn" type="submit">Verify</button>
            <button id="fpswd-btn">Resend OTP</button>
        </form>
    </div>
</body>
</html>
