<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezNews Sign Up</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="sign_up_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="signup-card">
        <img src="logo.png" alt="TezTecch News Logo" id="logo"><br>
        <h3>Sign Up</h3>
        <form id="signup-form" action="../user/profile.html">
            <input type="text" id="email" name="email" placeholder="Email or Phone Number" required><br><br>
            <input type="password" name="pswd" id="pswd" placeholder="Password" required><br><br>
            <input type="password" name="cfpswd" id="cfpswd" placeholder="Confirm Password" required><br>
            <button id="signup-btn">Sign Up</button><br>
            <p>Already have an account? <a href="log_in.html">Log In</a></p>
        </form>
    </div>
</body>
</html>
