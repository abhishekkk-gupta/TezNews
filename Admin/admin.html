<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezNews Admin Log In</title>
    <link rel="icon" type="image/png" href="images/logo_wbg.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <img src="images/logo.png" alt="TezTecch News Logo" id="logo">
        <h3>Admin Log In</h3>
        <form id="login-form" action="">
            <input type="text" id="email" name="email" placeholder="Admin Username" required><br><br>
            <input type="password" name="pswd" id="pswd" placeholder="Password" required><br>
            <p id="error-msg">Invalid username or password</p>
            <button id="login-btn" type="submit">Log In</button><br>
        </form>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();

            var username = document.getElementById("email").value;
            var password = document.getElementById("pswd").value;

            if (username === "admin1" && password === "pass@123") {
                window.location.href = "admin-dashboard.html";
            } else {
                alert("Invalid username or password. Please try again.");
                document.getElementById("error-msg").style.display = "block";
            }
        });
    </script>
</body>
</html>
